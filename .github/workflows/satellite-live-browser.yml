name: Satellite 2.3 Deployed Browser QA
on:
  pull_request:
    paths:
      - "components/CupolaExperience.tsx"
      - "components/OrbitalContextPanel.tsx"
      - "lib/earth/milkyWayShader.ts"
      - "lib/earth/celestialStarShader.ts"
      - "app/globals.css"
      - "app/api/satellites/**"
      - ".github/workflows/satellite-live-browser.yml"
  push:
    branches: ["main"]
    paths:
      - "components/CupolaExperience.tsx"
      - "components/OrbitalContextPanel.tsx"
      - "lib/earth/milkyWayShader.ts"
      - "lib/earth/celestialStarShader.ts"
      - "app/globals.css"
      - "app/api/satellites/**"
      - ".github/workflows/satellite-live-browser.yml"
  workflow_dispatch:
    inputs:
      worker_url:
        description: "Existing deployed Cloudflare Worker URL to verify"
        type: string
        required: true
permissions:
  contents: read
  issues: read
  checks: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install actual Chromium with SwiftShader
        run: |
          npm install --prefix /tmp/satbrowser --no-audit --no-fund playwright@1.56.1
          /tmp/satbrowser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify exact Cloudflare Preview, source, API, motion and Follow
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          mkdir -p satellite-browser-test
          node <<'JS'
          const {chromium}=require('/tmp/satbrowser/node_modules/playwright');
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const timer=require('node:perf_hooks').performance;
          const report={date:new Date().toISOString(),revision:process.env.PR_SHA||'manual'};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function target(){
            if(process.env.GITHUB_EVENT_NAME==='push'){
              const sha=process.env.GITHUB_SHA;
              const api='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY;
              for(let n=0;n<20;n++){
                const res=await fetch(api+'/commits/'+sha+'/check-runs?per_page=100',{
                  headers:{Authorization:'Bearer '+process.env.GH_TOKEN,
                    Accept:'application/vnd.github+json',
                    'User-Agent':'cupola-satellite-main-qa'}});
                if(res.ok){
                  const checks=(await res.json()).check_runs||[];
                  const deployed=checks.some(x=>
                    x.name==='Workers Builds: cupola-planet' &&
                    x.app?.slug==='cloudflare-workers-and-pages' &&
                    x.conclusion==='success');
                  if(deployed){
                    console.log('PRODUCTION CLOUDFLARE SHA VERIFIED',sha);
                    return 'https://cupola-planet.oleg22777.workers.dev';
                  }
                }
                console.log('Production deployment pending',n+1);
                await sleep(15000);
              }
              throw Error('No SHA-verified Cloudflare production deployment '+sha);
            }
            if(process.env.GITHUB_EVENT_NAME!=='pull_request'){
              if(!process.env.WORKER_URL)throw Error('Missing deployed WORKER_URL');
              return new URL(process.env.WORKER_URL).origin;
            }
            const sha=process.env.PR_SHA;
            assert.match(sha,/^[0-9a-f]{40}$/);
            const api='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY;
            for(let n=0;n<16;n++){
              const res=await fetch(api+'/issues/'+process.env.PR_NUMBER+'/comments?per_page=100',{
                headers:{Authorization:'Bearer '+process.env.GH_TOKEN,
                  Accept:'application/vnd.github+json',
                  'User-Agent':'cupola-satellite-browser-qa'}});
              assert.equal(res.status,200,'GitHub comments for exact deployment');
              const comments=await res.json();
              for(const c of comments){
                if(c.user?.login!=='cloudflare-workers-and-pages[bot]')continue;
                const re=/<td><a href="(https:\/\/[0-9a-f]{8}-cupola-planet\.[^"]+\.workers\.dev)">[^<]+<\/a><\/td>\s*<td>([0-9a-f]{7})<\/td>/g;
                for(const m of (c.body||'').matchAll(re)){
                  if(m[2]===sha.slice(0,7))return new URL(m[1]).origin;
                }
              }
              // Some successful Cloudflare builds never post their bot
              // history comment. Verify the exact GitHub SHA's Workers check,
              // then fingerprint the branch Worker before accepting an alias.
              if(n>=3 && n%4===3){
                const checks=await fetch(api+'/commits/'+sha+'/check-runs?per_page=100',{
                  headers:{Authorization:'Bearer '+process.env.GH_TOKEN,
                    Accept:'application/vnd.github+json',
                    'User-Agent':'cupola-satellite-browser-qa'}});
                if(checks.ok){
                  const list=await checks.json();
                  const cf=list.check_runs?.find(x=>
                    x.name==='Workers Builds: cupola-planet' &&
                    x.app?.slug==='cloudflare-workers-and-pages');
                  if(cf?.conclusion==='success'){
                    // Never probe a preview from an unrelated old branch.
                    // The Cloudflare check for THIS SHA supplies the build's
                    // actual preview branch in its details URL.
                    const match=String(cf.details_url||'').match(
                      new RegExp("/previews/([a-z0-9-]+)/builds/[0-9a-f-]+(?:[/?#]|$)"));
                    if(match){
                      const alias='https://'+match[1]+
                        '-cupola-planet.oleg22777.workers.dev';
                      try{
                        const probe=await fetch(alias+'/api/satellites',
                          {signal:AbortSignal.timeout(45000)});
                        if(probe.status===200){
                          const snapshot=await probe.json();
                          if(snapshot.count>=100 &&
                             ['measured','worker-clock-unavailable'].includes(
                               snapshot.feedHealth?.sgp4TimingStatus)){
                            console.log('CLOUDFLARE CURRENT BRANCH PREVIEW',sha,
                              'Cloudflare check SUCCESS + v2.5 API marker',alias);
                            return alias;
                          }
                        }
                      }catch(error){
                        console.log('Current branch preview pending:',String(error).slice(0,160));
                      }
                    }
                  }
                }
              }
              console.log('Preview pending',n+1);
              await sleep(15000);
            }
            throw Error('Missing immutable Cloudflare Preview for SHA '+sha);
          }
          (async()=>{
            const origin=await target();report.worker=origin;
            const browser=await chromium.launch({headless:true,
              args:['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
            const page=await browser.newPage({viewport:{width:1400,height:900}});
            const errors=[];
            const skyShaderErrors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',message=>{
              const msg=message.text();
              if(message.type()==='error' &&
                /THREE.WebGLProgram|Shader Error|VALIDATE_STATUS|ERROR: 0:|GLSL shader/i.test(msg))
                skyShaderErrors.push(msg.slice(0,800));
            });
            try{
              const t=timer.now();
              const response=await page.request.get(origin+'/api/satellites',{timeout:120000});
              const body=await response.body();
              report.apiMs=Math.round(timer.now()-t);
              report.httpStatus=response.status();report.bytes=body.length;
              report.contentEncoding=response.headers()['content-encoding']||null;
              report.cacheControl=response.headers()['cache-control']||null;
              assert.equal(response.status(),200,'real usable catalog');
              const data=JSON.parse(body.toString('utf8'));
              report.count=data.count;report.source=data.source;
              report.feedHealth=data.feedHealth;report.categories=data.categories;
              assert.ok(Array.isArray(data.satellites)&&data.satellites.length>=100,'catalog degraded');
              assert.equal(data.count,data.satellites.length);
              assert.equal(new Set(data.satellites.map(s=>s.id)).size,data.count,'duplicate NORAD');
              assert.equal(Object.values(data.categories).reduce((a,b)=>a+b,0),data.count);
              assert.equal(data.feedHealth?.orbitModel,'SGP4');
              // Old bulk schema stays available; UI requests lossless compact wire.
              const compactResponse=await page.request.get(origin+'/api/satellites?format=compact',
                {timeout:120000});
              assert.equal(compactResponse.status(),200,'compact bulk API');
              const compactBody=await compactResponse.body();
              const compactData=JSON.parse(compactBody.toString('utf8'));
              assert.equal(compactData.wireFormat,'compact-v1');
              assert.equal(compactData.count,data.count,'identical catalog count');
              assert.ok(compactData.satellites.length===data.count);
              report.compactBytes=compactBody.length;
              report.compactRatio=Number((compactBody.length/body.length).toFixed(3));
              assert.ok(report.compactRatio<0.85,'compact wire must reduce JSON by >=15%');
              for(const index of [0,1,Math.floor(data.count/2),data.count-1]){
                const old=data.satellites[index],row=compactData.satellites[index];
                assert.equal(row[0],old.id);
                assert.equal(row[1],old.name);
                assert.equal(row[7],old.epoch);
                // These are distinct SGP4 snapshots, potentially separated
                // by CDN cache TTL; compare actual angular displacement.
                const rad=Math.PI/180;
                const delta=Math.acos(Math.max(-1,Math.min(1,
                  Math.sin(row[3]*rad)*Math.sin(old.latitude*rad)+
                  Math.cos(row[3]*rad)*Math.cos(old.latitude*rad)*
                  Math.cos((row[4]-old.longitude)*rad))));
                assert.ok(delta<0.05,'orbital drift between snapshots');
                assert.ok(Math.abs(row[5]-old.altitude)<25);
                assert.ok(Math.abs(row[6]-old.velocity)<0.2);
                assert.equal(row[8]===null,old.motionTarget===null);
              }
              assert.equal(compactData.motionTargetTimestamp,
                new Date(Date.parse(compactData.generatedAt)+180000).toISOString());
              const elapsed=data.feedHealth?.sgp4ComputeMs;
              const timingStatus=data.feedHealth?.sgp4TimingStatus;
              assert.ok((Number.isFinite(elapsed)&&elapsed>=1&&timingStatus==='measured') ||
                (elapsed===null&&timingStatus==='worker-clock-unavailable'),
                'honest SGP4 Worker timing');
              const age=Date.now()-Date.parse(data.generatedAt);
              report.generatedAgeSeconds=Math.round(age/1000);
              assert.ok(Number.isFinite(age)&&Math.abs(age)<180000,'expired positions');
              const active=data.satellites.filter(s=>s.motionTarget);
              assert.ok(active.length>=100,'missing SGP4 motion');
              const sample=active.slice(0,1000);
              for(const s of sample){
                assert.ok(s.latitude>=-90&&s.latitude<=90&&s.longitude>=-180&&s.longitude<=180);
                assert.ok(s.altitude>=100&&s.altitude<=100000);
                assert.ok(Math.abs(Date.parse(s.motionTarget.timestamp)-Date.parse(data.generatedAt)-180000)<10000,'target timestamp');
              }
              const chosen=data.satellites.find(x=>x.id==='25544')||active[0];
              report.selectedNorad=chosen.id;
              const trackResponse=await page.request.get(origin+'/api/satellites?track='+chosen.id,
                {timeout:90000});
              report.trackStatus=trackResponse.status();
              assert.equal(trackResponse.status(),200,'real selected satellite track');
              const track=await trackResponse.json();
              assert.equal(track.satellite?.id,chosen.id);
              assert.ok(track.satellite.track.length>=80,'real 97-point orbit');
              report.trackPoints=track.satellite.track.length;
              console.log('LIVE API',JSON.stringify(report));
              const compactNetwork=[];
              page.on('request',request=>{
                if(request.url().includes('/api/satellites?format=compact'))
                  compactNetwork.push(request.url());
              });
              await page.goto(origin+'/?satellite='+encodeURIComponent(chosen.id)+'&satellitePerf=1',
                {waitUntil:'domcontentloaded',timeout:70000});
              await page.locator('canvas').first().waitFor({state:'visible',timeout:60000});
              await page.waitForFunction(id=>document.body.innerText.includes('NORAD '+id),
                chosen.id,{timeout:90000});
              const follow=page.getByRole('button',{name:/FOLLOW SATELLITE/}).first();
              // SwiftShader's software renderer can stall pointer actionability.
              // DOM click still invokes the actual React event handler.
              await follow.evaluate(node=>node.click(),{timeout:45000});
              await page.waitForFunction(()=>{
                const inspector=document.querySelector('[data-orbital-context="satellite"] .orbital-main-action');
                return inspector?.textContent?.includes('STOP FOLLOW');
              },null,{timeout:60000});
              await page.locator('[data-satellite-perf="enabled"]')
                .waitFor({state:'visible',timeout:60000});
              assert.match(await page.locator('[data-satellite-perf-state]').innerText(),
                /SATELLITES ON.*CLOUDS ON/);
              report.perfProbeMounted=true;
              report.raf=await page.evaluate(()=>new Promise(resolve=>{
                const since=performance.now(),times=[];
                function tick(t){times.push(t);
                  if(t-since<2500){requestAnimationFrame(tick);return;}
                  const gaps=times.slice(1).map((x,i)=>x-times[i]).sort((a,b)=>a-b);
                  resolve({frames:times.length,seconds:(t-since)/1000,
                    rafFps:times.length/((t-since)/1000),
                    p95FrameMs:gaps[Math.floor(gaps.length*.95)]||null});
                }requestAnimationFrame(tick);
              }));
              report.fpsDiagnostic=await page.locator('[data-satellite-perf-fps]').innerText();
              report.perfRendererLabel=await page.locator('[data-satellite-perf="enabled"]').innerText();
              assert.ok(report.perfRendererLabel.includes('LOCAL SATELLITE PERFORMANCE'));
              assert.equal(await page.locator('.right-now').count(),0,
                'old ISS/events dashboard must be removed');
              await page.locator('[data-orbital-context="satellite"]')
                .waitFor({state:'visible',timeout:15000});
              assert.equal(await page.locator('[data-orbital-expanded="false"]').count(),1);
              assert.match(await page.locator('[data-orbital-context="satellite"]').innerText(),
                /NORAD.*ALTITUDE.*SPEED/s);
              await page.locator('[data-orbital-context="satellite"] button')
                .filter({hasText:'DETAILS'}) .evaluate(node=>node.click());
              await page.locator('[data-orbital-expanded="true"]')
                .waitFor({state:'visible',timeout:10000});
              assert.match(await page.locator('[data-orbital-context="satellite"]').innerText(),
                /GROUND TRACK.*POSITION SNAPSHOT/s);
              await page.locator('[data-orbital-context="satellite"] button')
                .filter({hasText:'LESS'}) .evaluate(node=>node.click());
              await page.locator('[data-orbital-expanded="false"]')
                .waitFor({state:'visible',timeout:10000});
              report.orbitalContextVisible=true;
              // Verify both requested UX fixes against the actual deployed UI.
              // Check the actual geometry, default closed state and every control tab.
              const geometry=await page.evaluate(()=>{
                const rect=s=>{const e=document.querySelector(s);
                  if(!e)return null;const r=e.getBoundingClientRect();
                  return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height};};
                return {
                  title:rect('.orbital-context-compact .orbital-identity'),
                  preview:rect('.orbital-context-compact .orbital-compact-preview'),
                  inspector:rect('.orbital-context-compact'),
                  dock:rect('.hud-bottom-layout'),
                  actions:rect('.hud-bottom-layout .location-actions'),
                  mode:rect('.hud-bottom-layout .mode-switch'),
                };
              });
              const g=geometry;
              assert.ok(g.title&&g.preview&&g.inspector&&g.dock&&g.actions&&g.mode);
              assert.ok(g.preview.top>=g.title.bottom-1);
              assert.ok(g.preview.width>=g.inspector.width-45);
              assert.ok(g.actions.right<=g.mode.left-4,'cinematic dock controls must not intersect');
              assert.ok(g.dock.width<1100,'the minimal dock must not span the globe');
              assert.equal(await page.locator('.controls.cupola-control-center').count(),0,
                'Control Center is hidden until explicitly requested');
              assert.equal(await page.locator('.telemetry').count(),0,
                'persistent misleading telemetry must be removed');
              report.cinematicHudGeometry=geometry;
              await page.locator('.control-center-trigger').evaluate(node=>node.click());
              await page.locator('[data-control-center="layers"]').waitFor({state:'visible',timeout:10000});
              assert.equal(await page.locator('[data-control-center="layers"] .layer-row').count(),10);
              await page.getByRole('tab',{name:'VIEW'}).evaluate(node=>node.click());
              await page.locator('[data-control-center="view"]').waitFor({state:'visible'});
              assert.equal(await page.locator('[data-control-center="view"] .radio-row').count(),8,
                'Moon-centred orbit, optional Earthrise and Earth telescope are independent');
              assert.equal(await page.locator('[data-control-center="view"] .radio-row')
                .filter({hasText:'SUN VIEW'}).count(),1,'Solar Cinematic has a dedicated camera view');
              await page.getByRole('tab',{name:'EVENTS'}).evaluate(node=>node.click());
              await page.locator('[data-control-center="events"]').waitFor({state:'visible'});
              await page.getByRole('tab',{name:'LAYERS'}).evaluate(node=>node.click());
              await page.locator('[data-control-center="layers"]').waitFor({state:'visible'});
              // Regression for the user's actual bug: the FPS probe MUST keep
              // running when satellites are disabled, not freeze a stale FPS.
              const satelliteLayer=page.locator('button.layer-row')
                .filter({hasText:'Satellites'}).first();
              assert.ok(await satelliteLayer.count()===1,'satellite layer toggle');
              const compactCountBeforeWarmToggle=compactNetwork.length;
              await satelliteLayer.evaluate(node=>node.click());
              await page.waitForFunction(()=>{
                const hud=document.querySelector('[data-satellite-perf-state]');
                return hud?.textContent?.includes('SATELLITES OFF');
              },null,{timeout:30000});
              assert.ok(await page.locator('[data-satellite-perf="enabled"]').isVisible());
              report.satelliteOffProbeActive=true;
              await page.locator('[data-orbital-context]')
                .waitFor({state:'detached',timeout:12000});
              report.noPersistentOverview=true;
              await satelliteLayer.evaluate(node=>node.click());
              await page.waitForFunction(()=>{
                const hud=document.querySelector('[data-satellite-perf-state]');
                return hud?.textContent?.includes('SATELLITES ON');
              },null,{timeout:30000});
              await page.waitForFunction(()=>{
                const progress=document.querySelector('[aria-label="Satellites loading"]');
                return progress?.getAttribute('aria-valuenow')==='100';
              },null,{timeout:30000});
              assert.equal(compactNetwork.length,compactCountBeforeWarmToggle,
                'Re-enabling the warm fleet must not issue another compact download');
              report.warmToggleNoExtraCatalog=true;
              // Mobile uses the SAME full-fidelity settings, not a reduced duplicate list.
              await page.locator('.control-center-header button').evaluate(node=>node.click());
              await page.setViewportSize({width:390,height:844});
              await page.locator('[data-control-trigger]').waitFor({state:'visible'});
              await page.locator('[data-control-trigger]').evaluate(node=>node.click());
              await page.locator('[data-control-center="layers"]').waitFor({state:'visible'});
              const mobileGeometry=await page.evaluate(()=>{
                const a=document.querySelector('.controls.cupola-control-center')?.getBoundingClientRect();
                const n=document.querySelector('.mobile-nav')?.getBoundingClientRect();
                return a&&n?{panel:{left:a.left,right:a.right,top:a.top,bottom:a.bottom},
                             nav:{top:n.top,bottom:n.bottom},viewport:innerWidth}:null;
              });
              assert.ok(mobileGeometry,'mobile controls and navigation must exist');
              assert.ok(mobileGeometry.panel.left>=0 && mobileGeometry.panel.right<=mobileGeometry.viewport,
                'mobile Control Center must fit the viewport');
              assert.ok(mobileGeometry.panel.bottom<=mobileGeometry.nav.top,
                'mobile Control Center must sit above the bottom navigation');
              assert.equal(await page.locator('[data-control-center="layers"] .layer-row').count(),10,
                'mobile must retain all scientific layers');
              report.mobileControlGeometry=mobileGeometry;
              report.compactUiRequests=compactNetwork.length;
              assert.ok(report.compactUiRequests>0,'actual CUPOLA UI must request compact API');
              report.jsErrors=errors.filter(s=>/satellit|webgl|react error/i.test(s)).slice(0,10);
              assert.equal(report.jsErrors.length,0,'browser satellite errors');
              report.skyShaderErrors=skyShaderErrors.slice(0,5);
              assert.equal(report.skyShaderErrors.length,0,
                'GPU must compile the Milky Way and stellar point shader without GLSL errors');
              // Screenshot is DIAGNOSTIC, never a correctness gate. GitHub
              // SwiftShader can freeze WebGL rasterization for >30 seconds,
              // even after real API, React Follow and RAF QA all passed.
              report.status='PASS';
              try{
                await page.screenshot({path:'satellite-browser-test/follow-live.png',
                  timeout:10000,animations:'disabled'});
                report.screenshot='captured';
              }catch(error){
                report.screenshot='unavailable-in-software-renderer';
                console.warn('OPTIONAL SCREENSHOT SKIPPED:',String(error).slice(0,180));
              }
              // Real Chromium interaction with the solar mode, after the
              // independent satellite Follow/refresh assertions have passed.
              await page.setViewportSize({width:1400,height:900});
              await page.getByRole('tab',{name:'VIEW'}).evaluate(node=>node.click());
              await page.locator('[data-control-center="view"]').waitFor({state:'visible'});
              await page.locator('[data-control-center="view"] .radio-row')
                .filter({hasText:'SUN VIEW'}).evaluate(node=>node.click());
              await page.waitForTimeout(1100);
              report.sunViewActivated=(await page.locator('.controls.cupola-control-center').count())===0;
              assert.equal(report.sunViewActivated,true,'SUN VIEW must activate and dismiss control panel');
              assert.equal(skyShaderErrors.length,0,'solar HDR shader must compile in real WebGL');
              try{
                await page.screenshot({path:'satellite-browser-test/solar-cinematic.png',
                  timeout:10000,animations:'disabled'});
                report.solarScreenshot='captured';
              }catch(error){
                report.solarScreenshot='unavailable-in-software-renderer';
                console.warn('OPTIONAL SOLAR SCREENSHOT SKIPPED:',String(error).slice(0,180));
              }
              // Moon must be an actual navigable object, not the old arbitrary
              // near-Earth camera preset. Verify UI provenance and shader.
              await page.locator('.control-center-trigger').evaluate(node=>node.click());
              await page.getByRole('tab',{name:'VIEW'}).evaluate(node=>node.click());
              await page.locator('[aria-label="Sun and Moon geometry preview"]').waitFor({state:'visible'});
              const celestialReadout=await page.locator('[aria-label="Sun and Moon geometry preview"]').innerText();
              assert.match(celestialReadout,/MOON.*KM.*LIT/s);
              assert.match(celestialReadout,/ANALYTICAL PREVIEW/);
              assert.match(celestialReadout,/LUNAR MAP: NASA SVS \/ LROC.*NEUTRAL FALLBACK/);
              assert.match(celestialReadout,/NASA SVS · ERNIE WRIGHT · NOAH PETRO/);
              // The NASA 2K texture is prewarmed on scene mount, so the
              // response may arrive BEFORE the visitor selects MOON.
              // Verify source status in the actual React controls instead
              // of waiting for an incorrectly assumed click-time request.
              const before=await page.locator('[aria-label="Sun and Moon geometry preview"]').innerText();
              report.lunarMapBeforeMoonView=before.match(/LUNAR TEXTURE · (LOADING|NASA LROC ACTIVE|NASA MAP RETRY PENDING)/)?.[1]??'unreported';
              await page.locator('[data-control-center="view"] .radio-row')
                .filter({hasText:'MOON · CENTERED ORBIT'}).evaluate(node=>node.click());
              await page.waitForTimeout(400);
              // Source availability is tested independently. Only claim
              // NASA LROC ACTIVE when TextureLoader has decoded the bitmap.
              const nasaAsset=await page.request.get(report.worker+'/api/moon-texture',
                {timeout:14000}).catch(()=>null);
              report.lunarNasaSourceStatus=nasaAsset?.status()??'upstream-timeout';
              if(nasaAsset?.status()===200)
                assert.equal(nasaAsset.headers()['x-cupola-lunar-source'],
                  'NASA-SVS-LROC-2025','Moon cache must carry NASA provenance');
              else console.warn('NASA LROC SOURCE UNAVAILABLE: fallback image expected');
              // LOLA is an optional verified height layer. Check the real
              // source response independently; outage must not break Moon.
              const reliefAsset=await page.request.get(report.worker+'/api/moon-relief',
                {timeout:14000}).catch(()=>null);
              report.lunarLolaSourceStatus=reliefAsset?.status()??'upstream-timeout';
              if(reliefAsset?.status()===200)
                assert.equal(reliefAsset.headers()['x-cupola-lunar-relief-source'],
                  'NASA-LRO-LOLA-SVS4720','LOLA must carry verified NASA provenance');
              else console.warn('NASA LOLA SOURCE UNAVAILABLE: conservative spherical fallback');
              // The 4K maps are generated from 16-bit NASA originals, published
              // as immutable same-origin Cloudflare static assets. They MUST
              // exist in this exact PR build: a 200 image request alone to
              // /api/moon-texture only verifies the older 2K fallback.
              for(const [url,property] of [
                ['/moon/lroc_color_4k.webp','lunar4kSourceStatus'],
                ['/moon/lola_height_4k.webp','lunar4kReliefStatus'],
              ]){
                const response=await page.request.get(report.worker+url,{timeout:20000});
                report[property]=response.status();
                assert.equal(response.status(),200,'Real NASA 4K lunar asset missing: '+url);
                assert.match(response.headers()['content-type']||'',/image\/webp/i);
                const buffer=await response.body();
                assert.ok(buffer.length>100000 && buffer.length<8_000_000);
                assert.equal(buffer.toString('ascii',0,4),'RIFF');
                assert.equal(buffer.toString('ascii',8,12),'WEBP');
              }
              // In the viewport, the camera must actually apply both decoded
              // NASA HD maps (not simply receive HTTP 200 responses).
              await page.locator('.control-center-trigger').evaluate(node=>node.click());
              await page.getByRole('tab',{name:'VIEW'}).evaluate(node=>node.click());
              await page.waitForFunction(()=>{
                const status=document.querySelector('[aria-label="Sun and Moon geometry preview"]')?.textContent||'';
                return status.includes('NASA LROC HD ACTIVE')&&status.includes('NASA LOLA HD ACTIVE');
              },null,{timeout:30000});
              report.lunar4kMaterialApplied=true;
              // Visual-only Moon distance options must be explicit and honest.
              // Toggle all settings on the real deployed React/Three scene.
              const distancePanel=page.locator('[aria-label="Moon visual distance"]');
              const distanceButton=(name)=>distancePanel.getByRole('button',{name,exact:true});
              assert.equal(await distanceButton('CINE 2×').getAttribute('aria-pressed'),'true');
              await distanceButton('CINE 3×').evaluate(node=>node.click());
              assert.equal(await distanceButton('CINE 3×').getAttribute('aria-pressed'),'true');
              assert.ok((await page.locator('[data-control-center="view"]').innerText()).includes('NOT PHYSICAL'),
                'Compressed lunar view must not be mislabeled as real orbit');
              await distanceButton('REAL 1×').evaluate(node=>node.click());
              assert.equal(await distanceButton('REAL 1×').getAttribute('aria-pressed'),'true');
              await distanceButton('CINE 2×').evaluate(node=>node.click());
              assert.equal(await distanceButton('CINE 2×').getAttribute('aria-pressed'),'true');
              report.moonCinematicDistanceOptions='REAL 1× / CINE 2× / CINE 3×';
              await page.locator('[aria-label="Close controls"]').evaluate(node=>node.click());
              await page.waitForTimeout(850);
              report.moonViewActivated=(await page.locator('.controls.cupola-control-center').count())===0;
              assert.equal(report.moonViewActivated,true,'MOON view must navigate to the real lunar sphere');
              assert.equal(skyShaderErrors.length,0,'Earth/Moon eclipse shaders must compile without GLSL errors');
              try{
                await page.screenshot({path:'satellite-browser-test/lunar-geocentric.png',
                  timeout:10000,animations:'disabled'});
                report.lunarScreenshot='captured';
              }catch(error){
                report.lunarScreenshot='unavailable-in-software-renderer';
                console.warn('OPTIONAL MOON SCREENSHOT SKIPPED:',String(error).slice(0,180));
              }
              // Visual QA for ALL lunar presets. The previous static tests
              // passed even though Moon Orbit was showing the wrong hemisphere.
              // Separate screenshots expose wrong framing or texture issues.
              for(const [label,filename] of [
                ['MOON · EARTHRISE','lunar-orbit.png'],
                ['MOON · EARTH TELESCOPE','lunar-earth-telescope.png'],
              ]){
                await page.locator('.control-center-trigger').evaluate(el=>el.click());
                await page.getByRole('tab',{name:'VIEW'}).evaluate(el=>el.click());
                await page.locator('[data-control-center="view"] .radio-row')
                  .filter({hasText:label}).evaluate(el=>el.click());
                await page.waitForTimeout(1250);
                assert.equal(await page.locator('.controls.cupola-control-center').count(),0,
                  label+' must select a real view and close the panel');
                assert.equal(skyShaderErrors.length,0,label+' must not break lunar GLSL');
                try{
                  await page.screenshot({path:'satellite-browser-test/'+filename,
                    timeout:10000,animations:'disabled'});
                }catch(error){
                  console.warn('OPTIONAL '+label+' IMAGE SKIPPED:',String(error).slice(0,180));
                }
              }
              report.threeLunarViewsActivated=true;
            }catch(err){report.status='FAIL';report.error=String(err);throw err;}
            finally{
              fs.writeFileSync('satellite-browser-test/report.json',JSON.stringify(report,null,2));
              console.log('SATELLITE BROWSER QA',JSON.stringify(report));
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: satellite-real-browser-evidence
          path: satellite-browser-test/
          if-no-files-found: ignore
