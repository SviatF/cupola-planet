name: CUPOLA Scene Capture On Demand

on:
  workflow_dispatch:
    inputs:
      page:
        description: "Explicit CUPOLA page asking for a new asset"
        required: true
        default: home
        type: choice
        options:
          - home
          - satellites
          - earth
      output:
        description: "Capture real rendered still or 8-second WebGL scene video"
        required: true
        default: still
        type: choice
        options:
          - still
          - video

permissions:
  contents: read

concurrency:
  group: cupola-scene-capture-${{ inputs.page }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for matching production scene SHA
        env:
          CUPOLA_CAPTURE_ORIGIN: https://cupola.earth
          CUPOLA_RELEASE_WAIT_MS: "600000"
        run: node scripts/scene-capture/wait-production-release.mjs
      - name: Install headless rendering and image encoders
        run: npm install --no-save --ignore-scripts playwright@1.58.2 sharp@0.34.4
      - name: Install Chromium and rendering dependencies
        run: npx playwright install chromium
      - name: Select allowlisted page camera preset
        id: source
        env:
          PAGE_ID: ${{ inputs.page }}
        run: |
          if [ "$PAGE_ID" = "home" ]; then echo 'preset=home-hero' >> "$GITHUB_OUTPUT";
          elif [ "$PAGE_ID" = "satellites" ]; then echo 'preset=satellite-atlas-hero' >> "$GITHUB_OUTPUT";
          elif [ "$PAGE_ID" = "earth" ]; then echo 'preset=from-orbit-feature' >> "$GITHUB_OUTPUT";
          else echo 'Unsupported page request' >&2; exit 1; fi
      - name: Ensure video tooling for actual 8-second WebM trim
        if: inputs.output == 'video'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Export authentic CUPOLA WebGL media from explicit request
        env:
          CAPTURE_PRESET: ${{ steps.source.outputs.preset }}
          CUPOLA_CAPTURE_PAGE: ${{ inputs.page }}
          CUPOLA_CAPTURE_TYPE: ${{ inputs.output }}
          CUPOLA_CAPTURE_ORIGIN: https://cupola.earth
          CUPOLA_CAPTURE_OUT: capture-output
        run: |
          node scripts/scene-capture/render.mjs "$CAPTURE_PRESET"
          node scripts/scene-capture/verify-candidate.mjs "capture-output/$CAPTURE_PRESET.json"
          node scripts/scene-capture/assess-candidate.mjs "capture-output/$CAPTURE_PRESET.json"
      - name: Save UNAPPROVED captures with source-provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cupola-${{ inputs.page }}-${{ inputs.output }}-qa
          path: capture-output/*
          retention-days: 14
          if-no-files-found: warn
