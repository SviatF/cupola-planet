name: Build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Retry transient npm registry 404s; fail normally if the package is genuinely missing.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm install --no-audit --no-fund && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 12))
          done
      - name: Verify cloud publisher freshness watchdog regression
        run: python3 scripts/cloud-science/watch_publishers.py --self-test
      - name: Protect Earth event feeds and weather layer provenance
        run: node scripts/cloud-science/test_earth_events_integrity.mjs
      - name: Verify four free near-live Earth source time and report provenance guards
        run: node scripts/cloud-science/test_earth_near_live_feeds.mjs
      - name: Protect observed lightning provenance and visibility
        run: node scripts/cloud-science/test_observed_lightning.mjs
      - name: Verify independent LightningMaps reference without unlicensed data access
        run: node scripts/cloud-science/test_lightning_source_reference.mjs
      - name: Protect cinematic flashes over verified storm zones
        run: node scripts/cloud-science/test_storm_zone_flashes.mjs
      - name: Verify free NOAA GLM one-shot event provenance and no replay
        run: node scripts/lightning/test_glm_one_shot.mjs
      - name: Verify accurate georegistration and verified lightning freshness
        run: node scripts/cloud-science/test_lightning_georeference.mjs
      - name: Guard observed Americas lightning coverage and brightness
        run: node scripts/cloud-science/test_lightning_americas_coverage.mjs
      - name: Protect cinematic branching lightning and cloud illumination
        run: node scripts/cloud-science/test_cinematic_lightning_bolts.mjs
      - name: Protect lightweight celestial backdrop and city lights
        run: node scripts/cloud-science/test_cinematic_optics.mjs
      - name: Guard daily NASA VIIRS dynamic city lights and cloud-safe satellite surface
        run: node scripts/cloud-science/test_daily_imagery_scene.mjs
      - name: Verify VIIRS daily imagery changes actual globe surface without removing Cloud V3
        run: node scripts/cloud-science/test_viirs_globe_fusion.mjs
      - name: Protect direct Earth event fly-to controls
        run: node scripts/cloud-science/test_earth_event_shortcuts.mjs
      - name: Protect first paint, Cinema cloud persistence and source priority
        run: node scripts/cloud-science/test_cloud_first_paint.mjs
      - name: Verify automatic recovery from stale Cloud V3 to refreshed L2
        run: node scripts/cloud-science/test_cloud_auto_recovery.mjs
      - name: Verify orbit-arc geometry and per-satellite GPU timekeeping
        run: node scripts/cloud-science/test_satellite_orbital_motion.mjs
      - name: Verify true SGP4 propagation against ISS TLE and stale-epoch policy
        run: node scripts/cloud-science/test_satellite_sgp4.mjs
      - name: Benchmark 17k SGP4 orbits and validate Follow snapshot isolation
        run: node scripts/cloud-science/test_satellite_performance.mjs
      - name: Guard satellite picking and snapshot freshness
        run: node scripts/cloud-science/test_satellite_picking.mjs
      - name: Verify 17k GPU fleet geometry persists across Follow/selection
        run: node scripts/cloud-science/test_satellite_fleet_selection.mjs
      - name: Guard selected orbital object context and low-cost UI
        run: node scripts/cloud-science/test_orbital_context_panel.mjs
      - name: Verify honest satellite download progress and compact layer feedback
        run: node scripts/cloud-science/test_layer_activation_progress.mjs
      - name: Verify on-device FPS instrumentation math and p95 windowing
        run: node scripts/cloud-science/test_satellite_performance_probe.mjs
      - name: Validate verified OMM failover and exact compact satellite wire roundtrip
        run: node scripts/cloud-science/test_satellite_failover_wire.mjs
      - run: npm run build
      - run: npm run cf:build
