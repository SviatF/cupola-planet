name: Prepare pinned Gaia sky asset
on:
  push:
    branches:
      - feat/cupola-v36-gaia-observed-sky
    paths:
      - scripts/sky/prepare_gaia_map.py
      - .github/workflows/gaia-source-asset.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        run: python -m pip install Pillow==11.3.0
      - name: Verify pinned Wikimedia ESA source and optimize WebP
        run: python scripts/sky/prepare_gaia_map.py
      - name: Commit the optimized derived asset to the same review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/astro/gaia-edr3-sky.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add pinned optimized ESA Gaia EDR3 Galactic all-sky map"
            git push origin HEAD:feat/cupola-v36-gaia-observed-sky
          fi
