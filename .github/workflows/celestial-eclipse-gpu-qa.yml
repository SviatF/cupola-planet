name: CUPOLA Lunar Eclipse GPU Pixel QA
on:
  pull_request:
    paths:
      - "lib/earth/moonEclipseShader.ts"
      - "lib/earth/lunarShadowField.ts"
      - "components/CupolaExperience.tsx"
      - "scripts/cloud-science/test_lunar_eclipse_gpu.mjs"
      - ".github/workflows/celestial-eclipse-gpu-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eclipse-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Chromium/SwiftShader
        run: |
          npm install --prefix /tmp/cupola-eclipse-gpu --no-audit --no-fund playwright@1.56.1
          /tmp/cupola-eclipse-gpu/node_modules/.bin/playwright install --with-deps chromium
      - name: Compare real Moon GLSL pixels with independent CPU geometry
        run: node scripts/cloud-science/test_lunar_eclipse_gpu.mjs
      - name: Upload numerical evidence and eclipse pixel masks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cupola-lunar-eclipse-gpu
          path: eclipse-gpu-evidence/
          if-no-files-found: ignore
