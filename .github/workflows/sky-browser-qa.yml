name: Cinematic Space Background Browser QA
on:
  pull_request:
    paths:
      - "components/CupolaExperience.tsx"
      - "lib/earth/milkyWayShader.ts"
      - "lib/earth/celestialStarShader.ts"
      - "lib/earth/gaiaSkyShader.ts"
      - "public/sky/gaia-edr3-equirect.webp"
      - "scripts/cloud-science/test_cinematic_optics.mjs"
      - ".github/workflows/sky-browser-qa.yml"
  push:
    branches: ["main"]
    paths:
      - "components/CupolaExperience.tsx"
      - "lib/earth/milkyWayShader.ts"
      - "lib/earth/celestialStarShader.ts"
      - "lib/earth/gaiaSkyShader.ts"
      - "public/sky/gaia-edr3-equirect.webp"
      - ".github/workflows/sky-browser-qa.yml"
permissions:
  contents: read
  issues: read
  checks: read
jobs:
  sky:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Protect stellar shapes, nebula continuity and occlusion contract
        run: node scripts/cloud-science/test_cinematic_optics.mjs
      - name: Install Chromium and software WebGL
        run: |
          npm install --prefix /tmp/cupola-sky --no-audit --no-fund playwright@1.56.1
          /tmp/cupola-sky/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify sky shaders in an actual deployed browser independently of science feeds
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          mkdir -p sky-browser-evidence
          node <<'JS'
          const assert=require('node:assert/strict');
          const {chromium}=require('/tmp/cupola-sky/node_modules/playwright');
          const fs=require('node:fs');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const sha=process.env.EVENT_NAME==='pull_request'?process.env.PR_SHA:process.env.MAIN_SHA;
          const report={sha,date:new Date().toISOString(),status:'PENDING'};
          (async()=>{
            assert.match(sha,/^[0-9a-f]{40}$/,'exact expected commit SHA');
            const api='https://api.github.com/repos/'+process.env.REPO;
            let worker;
            for(let i=0;i<28;i++){
              const response=await fetch(api+'/commits/'+sha+'/check-runs?per_page=100',{
                headers:{Authorization:'Bearer '+process.env.GH_TOKEN,
                  Accept:'application/vnd.github+json','User-Agent':'cupola-sky-qa'}});
              if(response.ok){
                const checks=(await response.json()).check_runs||[];
                const cf=checks.find(x=>x.name==='Workers Builds: cupola-planet'&&
                  x.app?.slug==='cloudflare-workers-and-pages'&&x.conclusion==='success');
                if(cf){
                  if(process.env.EVENT_NAME==='push'){
                    worker='https://cupola-planet.oleg22777.workers.dev';
                  } else {
                    // CF branch aliases are not reliable immutable preview URLs.
                    // Match the exact commit short SHA to the deployed URL in
                    // the Cloudflare bot's PR comment, as Satellite QA does.
                    const commentResponse=await fetch(
                      api+'/issues/'+process.env.PR_NUMBER+'/comments?per_page=100',{
                        headers:{Authorization:'Bearer '+process.env.GH_TOKEN,
                          Accept:'application/vnd.github+json',
                          'User-Agent':'cupola-sky-qa-preview'}});
                    if(commentResponse.ok){
                      const comments=await commentResponse.json();
                      for(const c of comments){
                        if(c.user?.login!=='cloudflare-workers-and-pages[bot]')continue;
                        const re=/<td><a href="(https:\/\/[0-9a-f]{8}-cupola-planet\.[^"]+\.workers\.dev)">[^<]+<\/a><\/td>\s*<td>([0-9a-f]{7})<\/td>/g;
                        for(const m of (c.body||'').matchAll(re)){
                          if(m[2]===sha.slice(0,7)){worker=new URL(m[1]).origin;break;}
                        }
                        if(worker)break;
                      }
                    }
                    // A successful exact-SHA Cloudflare check may publish no
                    // immutable PR comment. Resolve its own preview branch,
                    // not a hardcoded URL or unrelated deployment.
                    if(!worker){
                      const matched=String(cf.details_url||'').match(
                        /\/previews\/([a-z0-9-]+)\/builds\/[0-9a-f-]+(?:[/?#]|$)/);
                      if(matched){
                        const candidate='https://'+matched[1]+
                          '-cupola-planet.oleg22777.workers.dev';
                        try{
                          const probe=await fetch(candidate+'/',{
                            signal:AbortSignal.timeout(12000)});
                          if(probe.ok && (probe.headers.get('content-type')||'').includes('text/html')){
                            worker=candidate;
                            report.previewProvenance='SHA-specific Cloudflare SUCCESS check + its current branch alias';
                          }
                        }catch(error){
                          console.log('Cloudflare branch alias not ready:',String(error).slice(0,130));
                        }
                      }
                    }
                  }
                  if(worker)break;
                }
              }
              await sleep(9000);
            }
            assert.ok(worker,'SHA-matched Cloudflare worker must be built');
            report.worker=worker;
            console.log('SKY SHA-MATCHED WORKER',sha,worker);
            const browser=await chromium.launch({headless:true,
              args:['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
            try{
              const page=await browser.newPage({viewport:{width:1280,height:720}});
              const gaiaResponses=[];
              page.on('response',r=>{
                if(r.url().includes('/sky/gaia-edr3-equirect.webp'))
                  gaiaResponses.push({status:r.status(),type:r.headers()['content-type']||''});
              });
              const shaderErrors=[],pageErrors=[];
              page.on('console',m=>{
                const s=m.text();
                if(m.type()==='error'&&
                   /THREE.WebGLProgram|Shader Error|VALIDATE_STATUS|ERROR: 0:|GLSL shader|precision highp/i.test(s))
                  shaderErrors.push(s.slice(0,1200));
              });
              page.on('pageerror',e=>pageErrors.push(e.message));
              const response=await page.goto(worker+'/explore?cloudEngine=legacy',
                {waitUntil:'domcontentloaded',timeout:120000});
              assert.equal(response.status(),200,'app shell must work without upstream data');
              await page.locator('.scene-wrap canvas').first().waitFor({state:'visible',timeout:60000});
              await page.waitForTimeout(11000);
              report.gaiaMapResponses=gaiaResponses;
              assert.ok(gaiaResponses.some(r=>r.status===200 && /image\/webp/.test(r.type)),
                'real first-party ESA Gaia image must be successfully requested and served as WebP');
              const gaiaAsset=await page.request.get(worker+'/sky/gaia-edr3-equirect.webp');
              assert.equal(gaiaAsset.status(),200,'Gaia EDR3 must remain accessible as first-party asset');
              const gaiaBody=await gaiaAsset.body();
              assert.ok(gaiaBody.length>100000&&gaiaBody.length<1800000,
                'the Gaia texture must stay below the performance budget');
              assert.equal(gaiaBody.toString('ascii',0,4),'RIFF');
              assert.equal(gaiaBody.toString('ascii',8,12),'WEBP');
              report.gaiaImageBytes=gaiaBody.length;
              report.webgl=await page.evaluate(()=>{
                const canvas=document.querySelector('.scene-wrap canvas');
                const gl=canvas?.getContext('webgl2');
                if(!gl)return {available:false};
                return {available:true,version:String(gl.getParameter(gl.VERSION)),
                  viewport:[gl.drawingBufferWidth,gl.drawingBufferHeight],
                  devicePixelRatio:window.devicePixelRatio};
              });
              assert.ok(report.webgl?.available,'real WebGL 2 scene must initialize');
              assert.ok(report.webgl.viewport[0]>=720&&report.webgl.viewport[1]>=360);
              report.shaderErrors=shaderErrors.slice(0,5);
              report.pageErrors=pageErrors.slice(0,5);
              assert.equal(shaderErrors.length,0,'galaxy and stellar shaders must compile');
              assert.equal(pageErrors.length,0,'no React or GPU scene exceptions');
              report.status='PASS';
              try{
                await page.screenshot({path:'sky-browser-evidence/space-preview.png',
                  timeout:10000,animations:'disabled'});
                report.screenshot='captured';
                // A wider angle exposes the celestial field; the default hero
                // framing mostly fills the screen with Earth, masking sky QA.
                await page.mouse.move(700,350);
                for(let step=0;step<5;step++){
                  await page.mouse.wheel(0,1100);
                  await page.waitForTimeout(140);
                }
                await page.waitForTimeout(1800);
                try{
                  await page.screenshot({path:'sky-browser-evidence/space-wide.png',
                    timeout:12000,animations:'disabled'});
                  report.wideSkyScreenshot='captured';
                }catch(error){
                  report.wideSkyScreenshot='unavailable-in-software-renderer';
                }
              }catch(error){
                report.screenshot='software-WebGL screenshot unavailable';
              }
              // The orbital source is deliberately mocked only in this UI
              // regression; the science/satellite workflows test the real feed.
              // The progress line must never reach 100% for an HTTP 503.
              await page.route('**/api/satellites?format=compact', async route => {
                await new Promise(resolve => setTimeout(resolve, 850));
                await route.fulfill({status:503,contentType:'application/json',
                  body:JSON.stringify({error:'synthetic upstream outage'})});
              });
              await page.locator('.control-center-trigger').evaluate(el=>el.click());
              await page.locator('[data-control-center="layers"]').waitFor({state:'visible'});
              const satelliteRow=page.locator('.layer-load-item').filter({hasText:'Satellites'}).first();
              await satelliteRow.locator('.layer-row').evaluate(el=>el.click());
              await satelliteRow.locator('.layer-load-detail').waitFor({state:'visible',timeout:5000});
              await satelliteRow.getByText('CONNECTING TO SOURCE').waitFor({state:'visible',timeout:5000});
              await satelliteRow.getByText('SOURCE UNAVAILABLE · RETRY').waitFor({state:'visible',timeout:12000});
              assert.equal(await satelliteRow.getByText('100%').count(),0,
                'Upstream 503 must not report a fictitious successful 100%');
              await satelliteRow.locator('.layer-row').evaluate(el=>el.click());
              await satelliteRow.locator('.layer-load-detail').waitFor({state:'detached',timeout:5000});
              report.layerProgressQa='PASS: instant loading, graceful 503, no fabricated 100%, cancel on toggle-off';
            }finally{await browser.close();}
          })().catch(e=>{report.status='FAIL';report.error=String(e);process.exitCode=1;})
           .finally(()=>{
              fs.writeFileSync('sky-browser-evidence/report.json',JSON.stringify(report,null,2));
              console.log('CUPOLA SKY BROWSER QA',JSON.stringify(report));
            });
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cupola-cinematic-sky-evidence
          path: sky-browser-evidence/
          if-no-files-found: ignore
