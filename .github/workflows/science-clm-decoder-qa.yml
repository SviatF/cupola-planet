name: Meteosat MSG CLM PNG Decoder QA

on:
  pull_request:
    paths:
      - 'lib/earth/cloudMask.ts'
      - 'lib/earth/liveCloudShader.ts'
      - 'lib/earth/supplementalCloudDetail.ts'
      - 'app/api/clouds-geostationary/route.ts'
      - 'lib/earth/scientificCloudVisualGap.ts'
      - 'components/CupolaExperience.tsx'
      - 'scripts/cloud-science/test_clm_decoder.mjs'
      - 'scripts/cloud-science/test_wms_contour_smoothing.mjs'
      - 'scripts/cloud-science/test_cloud_shader_presence.mjs'
      - '.github/workflows/science-clm-decoder-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-categorical-png:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify actual PNG codec and CLM scene-category-to-alpha mapping
        run: |
          node scripts/cloud-science/test_clm_decoder.mjs
          node scripts/cloud-science/test_wms_contour_smoothing.mjs
          node scripts/cloud-science/test_cloud_shader_presence.mjs
