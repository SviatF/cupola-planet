name: Meteosat OCA Optical-Thickness Source Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-oca-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure OCA metadata cannot be promoted to observed cloud pixels
        run: python scripts/cloud-science/probe_meteosat_oca.py --self-test
      - name: Check currently published FCI/SEVIRI OCA granules, metadata only
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
        run: |
          mkdir -p cloud-science-meteosat
          python scripts/cloud-science/probe_meteosat_oca.py \
            --hours 6 --timeout 14 \
            --output cloud-science-meteosat/meteosat-oca-readiness.json
      - name: Keep product discovery separate from scientific decoding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('cloud-science-meteosat/meteosat-oca-readiness.json').read_text())
          assert obj['schema']=='cupola-meteosat-oca-readiness/v1'
          assert len(obj['sources'])==2
          assert obj['live_oca_pixels_in_cinema']==0
          assert obj['original_level2_modified'] is False
          assert not obj['active_nrt_license_verified']
          assert not any(x['native_data_downloaded'] or
                         x['native_oca_cloud_properties_decoded'] or
                         x['live_atlas_enabled'] for x in obj['sources'])
          print('PASS: authentic OCA discovery only; no fabricated science')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cupola-meteosat-oca-readiness
          path: cloud-science-meteosat/meteosat-oca-readiness.json
          if-no-files-found: warn
          retention-days: 7
