name: Celestial JPL Horizons Source QA

on:
  pull_request:
    paths:
      - "lib/earth/volcanoReportPresentation.ts"
      - "scripts/cloud-science/test_volcano_report_presentation.mjs"
      - "lib/earth/usgsEarthquakeFeed.ts"
      - "app/api/earthquakes/route.ts"
      - "scripts/cloud-science/test_usgs_earthquake_feed.mjs"
      - "lib/earth/moonEclipseShader.ts"
      - "lib/earth/lunarShadowField.ts"
      - "scripts/cloud-science/test_lunar_shadow_field.mjs"
      - "scripts/cloud-science/test_physical_lunar_phase.mjs"
      - "lib/earth/jplHorizons.ts"
      - "lib/earth/jplEarthFixed.ts"
      - "lib/earth/jplRendererBridge.ts"
      - "lib/earth/celestialEngine.ts"
      - "lib/earth/solarEarthFixed.ts"
      - "scripts/cloud-science/test_solar_earth_fixed.mjs"
      - "components/CupolaExperience.tsx"
      - "scripts/cloud-science/test_jpl_renderer_bridge.mjs"
      - "scripts/cloud-science/test_jpl_erfa_reference.py"
      - "scripts/cloud-science/erfa_reference_bridge.mjs"
      - "lib/earth/iersEop.ts"
      - "package.json"
      - "scripts/cloud-science/test_jpl_terrestrial.mjs"
      - "app/api/moon-jpl/route.ts"
      - "scripts/cloud-science/test_jpl_horizons_upstream.mjs"
      - ".github/workflows/celestial-jpl-source-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jpl-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent ERFA scientific reference
        run: python -m pip install --disable-pip-version-check pyerfa==2.0.1.5
      - name: Unit-test EOP parsing, UT1/polar motion and CUPOLA axes
        run: node scripts/cloud-science/test_jpl_terrestrial.mjs
      - name: Compare terrestrial rotation with ERFA IAU 2006/2000A
        run: python scripts/cloud-science/test_jpl_erfa_reference.py
      - name: Verify solar Earth-fixed terminator with independent astronomy
        run: node scripts/cloud-science/test_solar_earth_fixed.mjs
      - name: Validate true Sun–Moon–Earth illuminated fraction
        run: node scripts/cloud-science/test_physical_lunar_phase.mjs
      - name: Verify volcano reports cannot simulate live eruption plumes
        run: node scripts/cloud-science/test_volcano_report_presentation.mjs
      - name: Verify USGS earthquake source freshness and true occurrence timestamps
        run: node scripts/cloud-science/test_usgs_earthquake_feed.mjs
      - name: Test physical Moon umbra/penumbra across lunar surface
        run: node scripts/cloud-science/test_lunar_shadow_field.mjs
      - name: Guard JPL QA renderer, sampled phase and reversible Moon/Earth navigation
        run: node scripts/cloud-science/test_jpl_renderer_bridge.mjs
      - name: Cross-check live NASA/JPL Horizons input and frame-invariant outputs
        run: node scripts/cloud-science/test_jpl_horizons_upstream.mjs
