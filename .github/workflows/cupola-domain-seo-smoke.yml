name: CUPOLA Domain SEO Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cupola-domain-seo-smoke.yml"
      - "scripts/seo/verify_domain.py"
      - "app/sitemap.ts"
      - "app/robots.ts"
      - "app/layout.tsx"
      - "app/page.tsx"
      - "components/CupolaClient.tsx"
      - "app/satellites/**"
      - "lib/seo/**"
  workflow_dispatch:
  schedule:
    - cron: "27 6 * * *"

permissions:
  contents: read

concurrency:
  group: seo-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-seo:
    name: Verify cupola.earth crawlability
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTTPS, robots, sitemap and static SEO content
        run: python3 scripts/seo/verify_domain.py
