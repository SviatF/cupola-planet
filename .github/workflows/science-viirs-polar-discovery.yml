name: NOAA Polar VIIRS Cloud Mask Keyless Discovery

on:
  pull_request:
    paths:
      - 'scripts/cloud-science/probe_viirs_polar_sources.py'
      - '.github/workflows/science-viirs-polar-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-cloudmask-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify candidate filtering
        run: python3 scripts/cloud-science/probe_viirs_polar_sources.py --self-test
      - name: Check accessible NOAA-21, NOAA-20 and SNPP cloud mask products
        run: |
          python3 scripts/cloud-science/probe_viirs_polar_sources.py \
            --output viirs-polar-anonymous-inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cupola-viirs-polar-anonymous-inventory
          path: viirs-polar-anonymous-inventory.json
          if-no-files-found: warn
          retention-days: 7
